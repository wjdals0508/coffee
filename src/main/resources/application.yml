spring:
  application:
    name: coffee
  profiles:
    active: local


  datasource:
    url: jdbc:mysql://localhost:3306/coffee_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: a12345
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true